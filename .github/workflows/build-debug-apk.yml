name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    # GitHub Actions uses UTC. 30분마다 최신 웹 저장소를 다시 받아 APK를 만듭니다.
    - cron: '7,37 * * * *'
  repository_dispatch:
    types: [shiftcalendar-web-updated]

concurrency:
  group: shiftcalendar-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      - name: Download latest shiftcalendar web app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/shiftcalendar-web
          git clone --depth 1 https://github.com/kangJ-collab/shiftcalendar.git /tmp/shiftcalendar-web

          SOURCE_SHA="$(git -C /tmp/shiftcalendar-web rev-parse HEAD)"
          echo "Latest web source: $SOURCE_SHA"

          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README*' \
            --exclude='LICENSE*' \
            /tmp/shiftcalendar-web/ app/src/main/assets/www/

          printf '%s\n' "$SOURCE_SHA" > app/src/main/assets/www/.source-commit
          test -f app/src/main/assets/www/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/ShiftCalendarAndroid-v1.2.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiftCalendarAndroid-v1.2.1
          path: app/build/outputs/apk/debug/ShiftCalendarAndroid-v1.2.1-debug.apk
          retention-days: 30
